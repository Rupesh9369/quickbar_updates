<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickBar Pro — Updates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      line-height: 1.6;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 800px; margin: 0 auto; padding: 0 24px; }

    /* Nav */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(10,10,10,0.85); backdrop-filter: blur(20px);
      border-bottom: 1px solid #1e1e1e; padding: 0 24px; height: 56px;
      display: flex; align-items: center;
    }
    .nav-inner { max-width: 800px; margin: 0 auto; width: 100%; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
    .nav-logo img { width: 24px; height: 24px; border-radius: 6px; }
    .nav-badge {
      padding: 3px 10px; border-radius: 100px; font-size: 10px; font-weight: 600;
      background: rgba(220,249,0,0.1); color: #dcf900; border: 1px solid rgba(220,249,0,0.2);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Hero */
    .hero { padding: 120px 0 48px; text-align: center; }
    .hero h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 800; letter-spacing: -1.5px; margin-bottom: 12px; }
    .hero p { font-size: 16px; color: #a1a1aa; max-width: 480px; margin: 0 auto; }

    /* Filter Tabs */
    .filters {
      display: flex; gap: 6px; justify-content: center; margin: 32px 0 40px; flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 14px; border-radius: 100px; font-size: 12px; font-weight: 600;
      border: 1px solid #1e1e1e; background: #111; color: #a1a1aa; cursor: pointer;
      transition: all 0.2s ease; font-family: inherit;
    }
    .filter-btn:hover { border-color: #333; color: #f5f5f5; }
    .filter-btn.active { background: #dcf900; color: #000; border-color: #dcf900; }

    /* Update Cards */
    .updates-list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 80px; }
    .update-card {
      background: #111; border: 1px solid #1e1e1e; border-radius: 14px; padding: 24px;
      transition: border-color 0.2s ease;
    }
    .update-card:hover { border-color: #333; }
    .update-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .update-tag {
      padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 600;
      font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .tag-feature { background: rgba(220,249,0,0.1); color: #dcf900; }
    .tag-fix { background: rgba(255,95,115,0.1); color: #ff5f73; }
    .tag-improvement { background: rgba(96,165,250,0.1); color: #60a5fa; }
    .tag-new { background: rgba(147,130,255,0.1); color: #9382ff; }
    .update-date { font-size: 11px; color: #71717a; font-family: 'JetBrains Mono', monospace; }
    .update-version { font-size: 11px; color: #52525b; font-family: 'JetBrains Mono', monospace; margin-left: auto; }
    .update-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.3px; }
    .update-desc { font-size: 13px; color: #a1a1aa; line-height: 1.65; }
    .update-items { margin-top: 10px; list-style: none; }
    .update-items li {
      font-size: 13px; color: #a1a1aa; padding: 3px 0; display: flex; align-items: flex-start; gap: 8px;
    }
    .update-items li::before {
      content: '→'; color: #dcf900; font-weight: 600; flex-shrink: 0; margin-top: 1px;
    }

    /* Empty state */
    .empty { text-align: center; padding: 60px 0; color: #52525b; font-size: 14px; }

    /* Footer */
    .footer {
      border-top: 1px solid #1e1e1e; padding: 32px 0; text-align: center;
      font-size: 12px; color: #52525b;
    }
    .footer a { color: #71717a; transition: color 0.2s; }
    .footer a:hover { color: #f5f5f5; }

    @media (max-width: 640px) {
      .update-version { display: none; }
    }
  </style>
</head>
<body>
  <!-- Nav -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="https://quickbar.pro/images/logo.png" alt="QuickBar Pro" />
        <span>QuickBar<span style="color:#dcf900;">Pro</span></span>
      </a>
      <span class="nav-badge">UPDATES</span>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <h1>What's <span style="color:#dcf900;">new</span></h1>
      <p>Changelog, features, fixes, and improvements for QuickBar Pro.</p>
    </div>
  </section>

  <!-- Filters -->
  <div class="container">
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="feature">Features</button>
      <button class="filter-btn" data-filter="new">New</button>
      <button class="filter-btn" data-filter="improvement">Improvements</button>
      <button class="filter-btn" data-filter="fix">Fixes</button>
    </div>

    <!-- Updates List -->
    <div class="updates-list" id="updates-list"></div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Bar Pro. <a href="https://quickbar.pro" title="QuickBar Pro">quickbar.pro</a></p>
    </div>
  </footer>

  <script>
    fetch('updates.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var list = document.getElementById('updates-list');
        if (!data.updates || data.updates.length === 0) {
          list.innerHTML = '<div class="empty">No updates yet. Check back soon.</div>';
          return;
        }
        renderUpdates(data.updates, 'all');

        document.querySelectorAll('.filter-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            renderUpdates(data.updates, btn.getAttribute('data-filter'));
          });
        });
      })
      .catch(function() {
        document.getElementById('updates-list').innerHTML = '<div class="empty">Failed to load updates.</div>';
      });

    function renderUpdates(updates, filter) {
      var list = document.getElementById('updates-list');
      var filtered = filter === 'all' ? updates : updates.filter(function(u) { return u.tag === filter; });
      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">No updates in this category.</div>';
        return;
      }
      list.innerHTML = filtered.map(function(u) {
        var tagClass = 'tag-' + u.tag;
        var items = u.items ? u.items.map(function(i) { return '<li>' + i + '</li>'; }).join('') : '';
        return '<div class="update-card">' +
          '<div class="update-header">' +
            '<span class="update-tag ' + tagClass + '">' + u.tag + '</span>' +
            '<span class="update-date">' + u.date + '</span>' +
            (u.version ? '<span class="update-version">v' + u.version + '</span>' : '') +
          '</div>' +
          '<div class="update-title">' + u.title + '</div>' +
          '<div class="update-desc">' + u.description + '</div>' +
          (items ? '<ul class="update-items">' + items + '</ul>' : '') +
        '</div>';
      }).join('');
    }
  </script>
</body>
</html>
