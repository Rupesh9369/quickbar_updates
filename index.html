<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickBar Pro — What's New</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a; color: #f5f5f5; line-height: 1.6; min-height: 100vh;
    }
    .container { max-width: 640px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    .header { text-align: center; padding: 80px 0 16px; }
    .header img { width: 40px; height: 40px; border-radius: 10px; margin-bottom: 16px; }
    .header h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-bottom: 6px; }
    .header h1 span { color: #dcf900; }
    .header p { font-size: 14px; color: #71717a; }

    /* Changelog */
    .changelog { padding: 32px 0 80px; display: flex; flex-direction: column; gap: 16px; }
    .entry {
      background: #111; border: 1px solid #1e1e1e; border-radius: 12px; padding: 20px;
    }
    .entry-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .tag {
      padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 600;
      font-family: 'JetBrains Mono', monospace; text-transform: uppercase;
    }
    .tag-new { background: rgba(147,130,255,0.1); color: #9382ff; }
    .tag-feature { background: rgba(220,249,0,0.1); color: #dcf900; }
    .tag-improvement { background: rgba(96,165,250,0.1); color: #60a5fa; }
    .tag-fix { background: rgba(255,95,115,0.1); color: #ff5f73; }
    .entry-date { font-size: 11px; color: #52525b; font-family: 'JetBrains Mono', monospace; }
    .entry-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .entry-desc { font-size: 13px; color: #a1a1aa; line-height: 1.6; }
    .entry-items { list-style: none; margin-top: 10px; }
    .entry-items li {
      font-size: 13px; color: #a1a1aa; padding: 2px 0; display: flex; gap: 8px;
    }
    .entry-items li::before { content: '→'; color: #dcf900; font-weight: 600; flex-shrink: 0; }
    .empty { text-align: center; padding: 40px 0; color: #52525b; font-size: 13px; }

    /* Footer */
    .footer { border-top: 1px solid #1e1e1e; padding: 24px 0; text-align: center; font-size: 11px; color: #52525b; }
    .footer a { color: #71717a; text-decoration: none; }
    .footer a:hover { color: #f5f5f5; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="https://quickbar.pro/images/logo.png" alt="QuickBar Pro" />
      <h1>What's <span>New</span></h1>
      <p>Updates, features, and improvements.</p>
    </header>

    <div class="changelog" id="changelog"></div>

    <footer class="footer">
      <p>&copy; 2026 Bar Pro · <a href="https://quickbar.pro">quickbar.pro</a></p>
    </footer>
  </div>

  <script>
    fetch('updates.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var el = document.getElementById('changelog');
        if (!data.updates || data.updates.length === 0) {
          el.innerHTML = '<div class="empty">No updates yet.</div>';
          return;
        }
        el.innerHTML = data.updates.map(function(u) {
          var items = u.items ? u.items.map(function(i) { return '<li>' + i + '</li>'; }).join('') : '';
          return '<div class="entry">' +
            '<div class="entry-top">' +
              '<span class="tag tag-' + u.tag + '">' + u.tag + '</span>' +
              '<span class="entry-date">' + u.date + '</span>' +
            '</div>' +
            '<div class="entry-title">' + u.title + '</div>' +
            '<div class="entry-desc">' + u.description + '</div>' +
            (items ? '<ul class="entry-items">' + items + '</ul>' : '') +
          '</div>';
        }).join('');
      })
      .catch(function() {
        document.getElementById('changelog').innerHTML = '<div class="empty">Failed to load updates.</div>';
      });
  </script>
</body>
</html>
