<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickBar Pro — What's New</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a; color: #f5f5f5; line-height: 1.6; min-height: 100vh;
    }
    .container { max-width: 640px; margin: 0 auto; padding: 0 24px; }

    .header { text-align: center; padding: 80px 0 16px; }
    .header img { width: 40px; height: 40px; border-radius: 10px; margin-bottom: 16px; }
    .header h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-bottom: 6px; }
    .header h1 span { color: #dcf900; }
    .header p { font-size: 14px; color: #71717a; }

    .version-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 100px;
      background: rgba(220,249,0,0.08); border: 1px solid rgba(220,249,0,0.15);
      font-size: 12px; font-weight: 600; color: #dcf900; font-family: 'JetBrains Mono', monospace;
      margin-bottom: 24px;
    }

    .changelog-card {
      background: #111; border: 1px solid #1e1e1e; border-radius: 14px; padding: 28px; margin-bottom: 32px;
    }
    .changelog-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.3px; }
    .changelog-body { font-size: 13px; color: #a1a1aa; line-height: 1.8; white-space: pre-line; }
    .changelog-body strong { color: #f5f5f5; }

    .got-btn {
      display: block; width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: #dcf900; color: #000; font-size: 14px; font-weight: 700; cursor: pointer;
      text-align: center; text-decoration: none; transition: opacity 0.2s;
    }
    .got-btn:hover { opacity: 0.9; }

    .empty { text-align: center; padding: 40px 0; color: #52525b; font-size: 13px; }

    .footer { border-top: 1px solid #1e1e1e; padding: 24px 0; text-align: center; font-size: 11px; color: #52525b; }
    .footer a { color: #71717a; text-decoration: none; }
    .footer a:hover { color: #f5f5f5; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="https://quickbar.pro/images/logo.png" alt="QuickBar Pro" />
      <h1>What's <span>New</span></h1>
      <p>Latest updates and changelog.</p>
    </header>

    <div id="content"></div>

    <footer class="footer">
      <p>&copy; 2026 Bar Pro · <a href="https://quickbar.pro">quickbar.pro</a></p>
    </footer>
  </div>

  <script>
    fetch('changelog.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var el = document.getElementById('content');
        if (!data.changelog) {
          el.innerHTML = '<div class="empty">No updates yet.</div>';
          return;
        }

        var formatted = data.changelog
          .replace(/^🚀 (.+)$/gm, '<strong style="color:#dcf900;">🚀 $1</strong>')
          .replace(/^🛠️ (.+)$/gm, '<strong style="color:#60a5fa;">🛠️ $1</strong>')
          .replace(/^🐛 (.+)$/gm, '<strong style="color:#ff5f73;">🐛 $1</strong>')
          .replace(/^➕ (.+)$/gm, '<strong style="color:#9382ff;">➕ $1</strong>')
          .replace(/^- (.+)$/gm, '  • $1');

        el.innerHTML =
          '<div class="version-badge">v' + data.version + '</div>' +
          '<div class="changelog-card">' +
            '<div class="changelog-title">' + data.title + '</div>' +
            '<div class="changelog-body">' + formatted + '</div>' +
          '</div>' +
          '<a href="' + (data.btnLink || '#') + '" target="_blank" class="got-btn">' + (data.btnText || 'Got it!') + '</a>';
      })
      .catch(function() {
        document.getElementById('content').innerHTML = '<div class="empty">Failed to load changelog.</div>';
      });
  </script>
</body>
</html>
